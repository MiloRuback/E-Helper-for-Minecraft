name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build development installer
        run: npm run dist:development

      - name: Keep development installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Rename-Item "release\Every-Helper-for-Minecraft-Setup-$version.exe" "Every-Helper-for-Minecraft-Development-Setup-$version.exe"

      - name: Build stable installer
        run: npm run dist:stable

      - name: Keep stable installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Rename-Item "release\Every-Helper-for-Minecraft-Setup-$version.exe" "Every-Helper-for-Minecraft-Stable-Setup-$version.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
